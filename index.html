<h3>Interest (may choose more than one)</h3>${chips(it,INT,"int")}</div>
<div class="card"><h2>Part A(2) All About Me</h2>${A2.map((l,i)=>tx("a2"+i,a2,"f"+i,l)).join("")}${A2G.map((g,i)=>`<h3>${g[0]}</h3>`+tx("g"+i+"a",a2,"g"+i+"a","This goal is important to me because")+tx("g"+i+"b",a2,"g"+i+"b","I will achieve this goal by doing: 1.")+tx("g"+i+"c",a2,"g"+i+"c","2.")).join("")}<h3>My Learnings</h3>${[1,2,3].map(i=>tx("ls"+i,a2,"ls"+i,"New thing I learn at school "+i)).join("")}${[1,2,3].map(i=>tx("lo"+i,a2,"lo"+i,"New thing I learn outside school "+i)).join("")}<h3>For My Teacher</h3>${ta("ft1",a2,"ft1","I would like my teacher to help me with")}${ta("ft2",a2,"ft2","I would like my teacher to know")}</div>
<div class="card"><h2>Part A(3) My Ambition Card</h2>${A3.map((g,i)=>tx("a3"+i,a3,"f"+i,g[0])).join("")}</div>
<div class="card"><h2>Part A(4) Parent–Teacher Partnership Card</h2><h3>Resources available at home</h3>${chips(a4.res,RES,"res")}${tx("ro",a4,"oth","Any other (please specify)")}<h3>Understanding of my Child</h3>${UND.map((q,i)=>`<p>${q}</p>${faces(a4.und[i],"und",["Yes","Sometimes","No","Not sure"]).replace(/data-v="(\d)"/g,`data-v="${i}:$1"`)}`).join("")}<h3>At school, my child needs support with</h3>${chips(a4.sup,SUP,"sup")}${ta("hm",a4,"home","Based on my discussion with the teacher, I will support my child at home by:")}<p class="mut">Record the parent's own words only.</p></div>`}
function partC(){const ss=cur();if(!ss)return`<div class="card">Select a student first.</div>`;const c=ss.c||(ss.c={});cbs.cl=v=>{const[i,a,l]=v.split(":");c[i]=c[i]||{l:[null,null,null],n:""};c[i].l[a]=c[i].l[a]==l?null:+l};
return`<div class="card"><h2>Part C – Summary for the Academic Year</h2><p class="mut">Teacher ticks the level and writes the note. Recorded activity levels are listed as reference only.</p></div>`+STD.map((s,i)=>{const ab=abil(s[0]),e=S.ev.filter(x=>x.sid===ss.id&&x.std===s[0]),cc=c[i]=c[i]||{l:[null,null,null],n:""};setTimeout(()=>{const t=$("cn"+i);if(t)t.oninput=()=>{cc.n=t.value;save()}});
return`<div class="card"><h3>${s[0]}</h3><small>${e.length} saved activit${e.length==1?"y":"ies"}</small>${ab.map((n,a)=>{const rec=e.map(x=>x.lvl[a]).filter(x=>x!=null).map(x=>LV[x][0]).join(" ");return`<div class="h${"ASC"[a]}" style="padding-left:8px;margin:6px 0"><b>${n}</b> <small>recorded: ${rec||"none"}</small><div class="row lv">${LV.map((l,k)=>`<button class="${cc.l[a]===k?"on":""}" data-cb="cl" data-v="${i}:${a}:${k}">${l}</button>`).join("")}</div></div>`}).join("")}<textarea id="cn${i}" placeholder="Observational note based on performance throughout the year">${esc(cc.n)}</textarea></div>`}).join("")+`<div class="card"><h3>Overall</h3>${ta("ov",c,"overall","Observational note (overall)")}</div>`}
function credits(){const ss=cur();const g=ss?ss.grade:6,d=CRED[g];return`<div class="card"><h2>Credits earned through HPC – Grade ${g}</h2><p>Credits earned per year: 40 · by completing HPC (70%): 28 · NCrF level: ${d.lv} · Total credit points: ${d.tot} · Points from HPC (70%): ${d.hpc}</p><div class="sc"><table><tr><th>Learning standard</th><th>Col 2</th><th>Level</th><th>Credit points (official)</th></tr>${STD.map((s,i)=>`<tr><td>${s[0]}</td><td>${C2[i]}</td><td>${d.lv}</td><td>${d.r[i]}</td></tr>`).join("")}</table></div><p class="mut">Official note: total of Column 2 is 22.25 against the 28 credits in Table 1; the remaining credits are for activities under bagless days. Column 5 (credit points earned by the learner) is left for teacher/school confirmation.</p></div>`}
function cov(){const cg=REG.length,cp=REG.reduce((a,g)=>a+g.competencies.length,0);const f=[["Part A(1): attendance, interests","Built; school header, APAAR, UDID, photo not in app"],["Part A(2), A(3), A(4)","Built (all official labels)"],["Part B frame: 9 standards × CG/competency/approach/activity/assessment","Built"],["Rubric abilities, subject-specific names","Built"],["Self-reflection (3 Q + 18 statements) and scoring","Built"],["Peer feedback (2 Q + 18 statements) and scoring","Built"],["Progress wheel, strengths, barriers, observations","Built"],["Part C nine summaries + Overall","Built"],["Credits Tables 1–4 + note","Built"]];
const n=[["Performance-level descriptor text per competency","Not imported"],["Exemplar activities and assessment questions library","Not imported"],["Real AI (transcribe, extract, annual summary), OCR, image analysis","Not connected; needs secure backend"],["Service worker / installable PWA","Not in hosted page"],["PDF export, import/restore, class bulk mode","Not built"]];
return`<div class="card"><h2>HPC Coverage Auditor</h2><p>Official registry imported from the How-to-fill PDF (appendix): <b>${cg}</b> curricular goals, <b>${cp}</b> competencies, auto-parsed.</p><p><span class="tag warn">NOT 100%</span> Do not treat this build as complete coverage.</p><h3>Implemented</h3><table>${f.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><h3>Missing</h3><table>${n.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><h3>Registry parse issues to verify</h3><ul><li>SSCG11 is a note in the source with no competencies; parsed text is a note fragment.</li><li>Social Science CG5–CG6 print as SCCG5/SCCG6 in the extracted text; check against the PDF.</li><li>SCCG7 and VCG4 may have lost competencies in extraction.</li></ul></div>`}
function settings(){return`<div class="card"><h2>Privacy</h2><p>Data stays in this browser. Nothing is sent anywhere. No AI keys in this page; production AI must go through a secure backend.</p><button data-act="exp()">Export all data (JSON)</button> <button class="d" data-act="wipe">Delete all local data</button></div>`}
window.exp=()=>{const b=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hpc-backup.json";a.click()};
function render(){$("nav").innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-act="go('${t[0]}')">${t[1]}</button>`).join("");
const v={home,students,activity,evidence,partA,partC,credits,cov,settings}[S.tab];$("app").innerHTML=v();$("net").textContent=navigator.onLine?"🟢 ONLINE":"🟠 OFFLINE MODE";window.scrollTo(0,0)}

const ACT={micGo:()=>mic(document.getElementById("lang").value),understand:()=>{const v=document.getElementById("typed").value;heard={t:v,s:suggest(v)};render()},speakAgain:()=>{heard=null;render()},wipe:()=>{if(confirm("Delete ALL local data?")){S={students:[],sel:null,ev:[],tab:"home"};A=null;save();render()}},installPwa:()=>doInstall()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(ACT[a])return ACT[a]();const m=/^(\w+)\((?:'([^']*)')?\)$/.exec(a);if(m&&typeof window[m[1]]==="function")window[m[1]](m[2])});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.sel==="std"){cbs.std(e.target.value);render()}});

if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
